<!doctype html>
<html lang="zh-CN" data-composition-variables='[
  {"id":"text","type":"string","label":"Card text","default":"先做起来"},
  {"id":"kind","type":"string","label":"Card kind","default":"hook"},
  {"id":"itemsJson","type":"string","label":"Panel items","default":"[]"},
  {"id":"mode","type":"string","label":"Display mode","default":"banner"}
]'>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <script src="./gsap.min.js"></script>
    <style>
      @font-face { font-family: "Microsoft YaHei"; src: local("Microsoft YaHei"); }
      * { box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; margin: 0; overflow: hidden; background: transparent; }
      body { font-family: "Microsoft YaHei", sans-serif; }
      #root { position: relative; width: 1080px; height: 1920px; background: transparent; }
      #card {
        position: absolute; top: 185px; left: 90px; max-width: 900px; padding: 24px 34px;
        border-left: 10px solid #24d2bf; border-radius: 8px; color: #fff; background: rgba(10, 25, 34, .88);
        box-shadow: 0 16px 42px rgba(0, 0, 0, .3); font-size: 66px; font-weight: 800; line-height: 1.22;
        letter-spacing: 0; opacity: 0;
      }
      #card.result { border-left-color: #ffd166; }
      #card.lesson { border-left-color: #ff7f66; }
      #card.evidence { border-left-color: #7bdff2; }
      #card.side-panel {
        top: 92px; left: 24px; width: 410px; max-width: none; min-height: 530px; padding: 28px 26px;
        border: 1px solid rgba(189, 127, 73, .46); border-left: 8px solid #dd8249; border-radius: 24px;
        color: #1d2025; background: rgba(255, 249, 238, .95); box-shadow: 0 24px 64px rgba(0, 0, 0, .23);
        font-size: 44px; backdrop-filter: blur(10px);
      }
      .panel-eyebrow { margin-bottom: 18px; color: #b96534; font-size: 22px; font-weight: 800; letter-spacing: 4px; }
      .panel-title { margin-bottom: 22px; font-size: 44px; font-weight: 900; line-height: 1.16; }
      .panel-list { display: grid; gap: 14px; }
      .panel-item {
        display: flex; align-items: center; min-height: 72px; padding: 11px 14px; border: 1px solid rgba(185, 123, 71, .32);
        border-radius: 15px; color: #24272d; background: rgba(255, 255, 255, .72); font-size: 28px; font-weight: 800;
        opacity: 0;
      }
      .panel-index {
        display: grid; place-items: center; width: 40px; height: 40px; margin-right: 14px; border-radius: 50%;
        color: #fff; background: #dc8249; font-size: 22px; flex: 0 0 auto;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="3.2" data-width="1080" data-height="1920" data-fps="30">
      <div id="card" class="clip" data-start="0" data-duration="3.2" data-track-index="1"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const variables = window.__hyperframes.getVariables();
      const card = document.querySelector("#card");
      let items = [];
      try { items = JSON.parse(String(variables.itemsJson || "[]")); } catch { items = []; }
      items = items.map(item => String(item || "").trim()).filter(Boolean).slice(0, 4);
      const sidePanel = String(variables.mode || "banner") === "side-panel" && items.length;
      if (sidePanel) {
        card.classList.add("side-panel");
        const eyebrow = document.createElement("div"); eyebrow.className = "panel-eyebrow"; eyebrow.textContent = "KEY POINTS · 重点拆解";
        const title = document.createElement("div"); title.className = "panel-title"; title.textContent = String(variables.text || "").slice(0, 24);
        const list = document.createElement("div"); list.className = "panel-list";
        items.forEach((value, index) => {
          const row = document.createElement("div"); row.className = "panel-item";
          const number = document.createElement("span"); number.className = "panel-index"; number.textContent = String(index + 1);
          const label = document.createElement("span"); label.textContent = value;
          row.append(number, label); list.appendChild(row);
        });
        card.append(eyebrow, title, list);
      } else card.textContent = String(variables.text || "").slice(0, 24);
      card.classList.add(String(variables.kind || "evidence"));
      const timeline = gsap.timeline({ paused: true });
      if (sidePanel) {
        timeline.fromTo(card, { opacity: 0, x: -88, scale: .98 }, { opacity: 1, x: 0, scale: 1, duration: .34, ease: "power3.out" }, 0);
        timeline.fromTo(card.querySelectorAll(".panel-item"), { opacity: 0, x: -26 }, { opacity: 1, x: 0, duration: .24, stagger: .1, ease: "power2.out" }, .16);
        timeline.to(card, { opacity: 0, x: -34, duration: .22, ease: "power2.in" }, 2.92);
      } else {
        timeline.fromTo(card, { opacity: 0, y: -28, scale: .97 }, { opacity: 1, y: 0, scale: 1, duration: .28, ease: "power2.out" }, 0);
        timeline.to(card, { opacity: 0, y: -16, duration: .22, ease: "power2.in" }, 2.92);
      }
      window.__timelines["main"] = timeline;
    </script>
  </body>
</html>
